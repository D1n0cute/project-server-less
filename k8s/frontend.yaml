apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: default # 👈 ต้องใส่
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: pannatronkanla/frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: default # 👈 ต้องใส่
spec:
  type: ClusterIP # 👈 FIX สำคัญ
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
